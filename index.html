<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16321a" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>"
    />
    <meta
      name="description"
      content="A browser-based Bloons-style tower defense game. Place monkeys, pop bloons, survive 20 waves."
    />
    <title>Bloons Tower Defense</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand"><span class="logo">🎈</span> Bloons&nbsp;TD</div>
        <div class="stats">
          <div class="stat cash" title="Cash">💰 <span id="cash">650</span></div>
          <div class="stat lives" title="Lives">❤️ <span id="lives">100</span></div>
          <div class="stat round" title="Round">🌊 <span id="round">0 / 20</span></div>
        </div>
        <div class="controls">
          <button id="speedBtn" title="Game speed">▶ 1×</button>
          <button id="pauseBtn" title="Pause / resume (Space)">⏸ Pause</button>
          <button id="startBtn" class="primary" title="Send the next wave (Enter)">Start Round</button>
        </div>
      </header>

      <main id="play">
        <div id="canvas-wrap">
          <canvas id="game" width="960" height="600"></canvas>
          <div id="overlay" class="overlay"></div>
        </div>

        <aside id="sidebar">
          <h2>Towers</h2>
          <div id="shop"></div>
          <div id="selected" class="panel hidden"></div>
          <div id="hint">
            <p><strong>How to play</strong></p>
            <p>Click a tower, then click the map to place it. Pop bloons before
              they escape — each escapee costs lives. Press <kbd>Start Round</kbd>
              to send the next wave.</p>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
